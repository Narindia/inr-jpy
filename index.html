<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="₹↔¥" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>₹ ↔ ¥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Sora:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d0d0d;
      color: #f0ede6;
      font-family: 'DM Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100svh;
      padding-top: max(env(safe-area-inset-top), 16px);
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 4px;
      width: 100%;
      max-width: 390px;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
      animation: fadeUp .3s ease both;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-radius: 10px;
      padding: 9px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #444;
      cursor: pointer;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { background: #ff6b2b1a; color: #ff6b2b; }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 12px;
      margin-top: 4px;
      animation: fadeUp .4s ease both;
    }
    .header-label {
      font-family: 'Sora', sans-serif;
      font-size: 10px;
      letter-spacing: .25em;
      color: #ff6b2b;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 390px;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 22px;
      padding: 16px;
      animation: fadeUp .4s .06s ease both;
      opacity: 0;
    }
    .field-label {
      font-size: 10px;
      letter-spacing: .2em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: #111;
      border: 1.5px solid #2e2e2e;
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: #ff6b2b66; }
    .sym {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .sym-from { color: #ff6b2b; }
    .sym-to   { color: #4ade80; }
    #from-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      color: #f0ede6;
      min-width: 0;
    }
    #from-input::placeholder { color: #2a2a2a; }
    .clear-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 20px;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
      display: none;
      -webkit-tap-highlight-color: transparent;
    }
    .middle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .toggle-btn {
      background: #222;
      border: 1.5px solid #333;
      border-radius: 50%;
      width: 38px; height: 38px;
      flex-shrink: 0;
      font-size: 16px;
      cursor: pointer;
      color: #ff6b2b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .toggle-btn:active { background: #2a2a2a; }
    .result-row {
      flex: 1;
      display: flex;
      align-items: center;
      background: #111;
      border: 1.5px solid #2a2a2a;
      border-radius: 14px;
      padding: 10px 14px;
      min-height: 52px;
      transition: border-color .2s, background .2s;
    }
    .result-row.active {
      background: #0c180c;
      border-color: #1d4d1d;
    }
    #to-result {
      font-family: 'DM Mono', monospace;
      font-size: 26px;
      color: #2a2a2a;
      transition: color .2s;
    }
    .result-row.active #to-result { color: #f0ede6; }
    .quick-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .quick-btn {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 9px 2px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #666;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-btn:active { border-color: #ff6b2b66; color: #ff6b2b; }
    .rate-info {
      margin-top: 10px;
      font-size: 11px;
      color: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-live     { background: #4ade80; animation: pulse 2s infinite; }
    .dot-loading  {
      width: 10px; height: 10px;
      border: 1.5px solid #333;
      border-top-color: #ff6b2b;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .dot-fallback { background: #f59e0b; }

    /* ── Warikan ── */
    .w-section-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .add-person-btn {
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #ff6b2b;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      padding: 4px 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s;
    }
    .add-person-btn:active { border-color: #ff6b2b44; }
    .person-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }
    .person-name-inp {
      flex: 1;
      background: #111;
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      padding: 8px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: #f0ede6;
      outline: none;
      min-width: 0;
      transition: border-color .15s;
    }
    .person-name-inp:focus { border-color: #ff6b2b44; }
    .person-name-inp::placeholder { color: #333; }
    .shares-ctrl {
      display: flex;
      align-items: center;
      background: #111;
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sh-btn {
      background: none;
      border: none;
      color: #ff6b2b;
      font-size: 16px;
      width: 30px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .sh-btn:active { background: #1a1a1a; }
    .sh-val {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: #f0ede6;
      width: 24px;
      text-align: center;
    }
    .rm-btn {
      background: none;
      border: none;
      color: #333;
      font-size: 18px;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .rm-btn:active { color: #666; }
    .w-result {
      margin-top: 12px;
      background: #0c180c;
      border: 1.5px solid #1d4d1d;
      border-radius: 14px;
      padding: 12px 14px;
      display: none;
    }
    .w-unit {
      font-size: 10px;
      letter-spacing: .15em;
      color: #4ade8077;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .w-divider { border-top: 1px solid #1a3d1a; margin: 8px 0; }
    .w-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
    }
    .w-person { font-size: 13px; color: #888; }
    .w-shares { font-size: 10px; color: #444; margin-left: 5px; }
    .w-amt {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      color: #4ade80;
    }
    .w-jpy {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #4ade8055;
      text-align: right;
    }
    .w-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
    }
    .w-total-label { font-size: 11px; color: #444; letter-spacing: .1em; }
    .w-total-amt {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: #555;
    }
    .w-total-jpy {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #555;
      text-align: right;
    }
    .total-inp {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      color: #f0ede6;
      min-width: 0;
    }
    .total-inp::placeholder { color: #2a2a2a; }

    /* ── Flags ── */
    .flags {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0.3;
    }
    .flags span { font-size: 52px; }
    .flags-arrow { font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <div class="tab-bar">
    <button class="tab active" data-tab="converter">換算</button>
    <button class="tab" data-tab="warikan">割り勘</button>
  </div>

  <!-- Converter -->
  <div class="header" id="header-wrap">
    <div class="header-label" id="header-label">India → Japan</div>
  </div>
  <div class="card" id="tab-converter">
    <div class="field-label" id="from-label">インドルピー</div>
    <div class="input-row">
      <span class="sym sym-from" id="from-sym">₹</span>
      <input id="from-input" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
      <button class="clear-btn" id="clear-btn">×</button>
    </div>
    <div class="middle-row">
      <button class="toggle-btn" id="toggle-btn">⇄</button>
      <div class="result-row" id="result-row">
        <span class="sym sym-to" id="to-sym">¥</span>
        <span id="to-result">—</span>
      </div>
    </div>
    <div class="quick-row" id="quick-row">
      <button class="quick-btn" data-v="100">₹100</button>
      <button class="quick-btn" data-v="500">₹500</button>
      <button class="quick-btn" data-v="1000">₹1K</button>
      <button class="quick-btn" data-v="5000">₹5K</button>
      <button class="quick-btn" data-v="10000">₹1万</button>
    </div>
    <div class="rate-info">
      <span id="rate-dot" class="dot dot-loading"></span>
      <span id="rate-text">レート取得中...</span>
    </div>
  </div>

  <!-- Warikan -->
  <div class="card" id="tab-warikan" style="display:none">
    <div class="field-label">合計金額</div>
    <div class="input-row">
      <span class="sym sym-from">₹</span>
      <input class="total-inp" id="total-inp" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
      <button class="clear-btn" id="total-clear">×</button>
    </div>
    <div class="w-section-hd">
      <div class="field-label" style="margin:0">メンバー</div>
      <button class="add-person-btn" id="add-person-btn">＋ 追加</button>
    </div>
    <div id="people-list"></div>
    <div class="w-result" id="w-result"></div>
  </div>

  <div class="flags">
    <span>🇮🇳</span>
    <span class="flags-arrow">↔</span>
    <span>🇯🇵</span>
  </div>

<script>
(function () {
  'use strict';

  // ── Converter ─────────────────────────────────────────────────────────────
  const FALLBACK_RATE = 1.695;
  const CACHE_KEY = 'inrjpy_rate_v2';
  let rate = FALLBACK_RATE;
  let mode = 'INR_TO_JPY';

  const fromInput   = document.getElementById('from-input');
  const toResult    = document.getElementById('to-result');
  const resultRow   = document.getElementById('result-row');
  const clearBtn    = document.getElementById('clear-btn');
  const toggleBtn   = document.getElementById('toggle-btn');
  const rateDot     = document.getElementById('rate-dot');
  const rateText    = document.getElementById('rate-text');
  const headerLabel = document.getElementById('header-label');
  const fromLabel   = document.getElementById('from-label');
  const fromSym     = document.getElementById('from-sym');
  const toSym       = document.getElementById('to-sym');
  const quickRow    = document.getElementById('quick-row');

  function dateStr() {
    return new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function getRate() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && (Date.now() - cached.ts) < 24 * 60 * 60 * 1000) {
        return { rate: cached.rate, fresh: false };
      }
      const res = await fetch('https://api.exchangerate-api.com/v4/latest/INR');
      if (!res.ok) throw new Error();
      const data = await res.json();
      const r = data.rates?.JPY;
      if (!r) throw new Error();
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rate: r, ts: Date.now() }));
      return { rate: r, fresh: true };
    } catch {
      try {
        const res2 = await fetch('https://open.er-api.com/v6/latest/INR');
        const data2 = await res2.json();
        const r2 = data2.rates?.JPY;
        if (!r2) throw new Error();
        localStorage.setItem(CACHE_KEY, JSON.stringify({ rate: r2, ts: Date.now() }));
        return { rate: r2, fresh: true };
      } catch {
        return { rate: FALLBACK_RATE, fresh: null };
      }
    }
  }

  function updateRateDisplay(fresh) {
    if (fresh === null) {
      rateDot.className = 'dot dot-fallback';
      rateText.textContent = `1 ₹ = ¥${rate.toFixed(3)}（参考値）`;
    } else {
      rateDot.className = 'dot dot-live';
      rateText.textContent = `1 ₹ = ¥${rate.toFixed(3)}（${dateStr()}）`;
    }
  }

  getRate().then(({ rate: r, fresh }) => { rate = r; updateRateDisplay(fresh); recalc(); });

  const QUICK_INR = [100, 500, 1000, 5000, 10000];
  const QUICK_JPY = [500, 1000, 5000, 10000, 50000];
  const LABELS_INR = ['₹100','₹500','₹1K','₹5K','₹1万'];
  const LABELS_JPY = ['¥500','¥1K','¥5K','¥1万','¥5万'];

  function updateUI() {
    const isINR = mode === 'INR_TO_JPY';
    headerLabel.textContent = isINR ? 'India → Japan' : 'Japan → India';
    fromLabel.textContent   = isINR ? 'インドルピー' : '日本円';
    fromSym.textContent     = isINR ? '₹' : '¥';
    toSym.textContent       = isINR ? '¥' : '₹';
    const vals   = isINR ? QUICK_INR : QUICK_JPY;
    const labels = isINR ? LABELS_INR : LABELS_JPY;
    quickRow.querySelectorAll('.quick-btn').forEach((btn, i) => {
      btn.dataset.v   = vals[i];
      btn.textContent = labels[i];
    });
  }

  function recalc() {
    const v = parseFloat(fromInput.value);
    if (!isNaN(v) && v >= 0 && fromInput.value !== '') {
      const isINR = mode === 'INR_TO_JPY';
      const result = isINR ? Math.round(v * rate) : Math.round(v / rate);
      toResult.textContent = result.toLocaleString('ja-JP');
      resultRow.classList.add('active');
      clearBtn.style.display = 'inline';
    } else {
      toResult.textContent = '—';
      resultRow.classList.remove('active');
      clearBtn.style.display = 'none';
    }
  }

  fromInput.addEventListener('input', recalc);
  fromInput.addEventListener('keydown', e => { if (e.key === 'Escape') clearConv(); });
  clearBtn.addEventListener('click', clearConv);
  function clearConv() { fromInput.value = ''; recalc(); fromInput.focus(); }

  toggleBtn.addEventListener('click', () => {
    mode = mode === 'INR_TO_JPY' ? 'JPY_TO_INR' : 'INR_TO_JPY';
    fromInput.value = '';
    updateUI();
    recalc();
  });

  quickRow.addEventListener('click', e => {
    const btn = e.target.closest('.quick-btn');
    if (!btn) return;
    fromInput.value = btn.dataset.v;
    recalc();
  });

  // ── Tab switching ──────────────────────────────────────────────────────────
  const tabConverter = document.getElementById('tab-converter');
  const tabWarikan   = document.getElementById('tab-warikan');
  const headerWrap   = document.getElementById('header-wrap');

  document.querySelector('.tab-bar').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isConv = tab.dataset.tab === 'converter';
    tabConverter.style.display = isConv ? '' : 'none';
    headerWrap.style.display   = isConv ? '' : 'none';
    tabWarikan.style.display   = isConv ? 'none' : '';
    setTimeout(() => (isConv ? fromInput : totalInp).focus(), 50);
  });

  // ── Warikan ───────────────────────────────────────────────────────────────
  const totalInp   = document.getElementById('total-inp');
  const totalClear = document.getElementById('total-clear');
  const peopleList = document.getElementById('people-list');
  const addBtn     = document.getElementById('add-person-btn');
  const wResult    = document.getElementById('w-result');

  // Default: 3人、傾斜あり（2口/1口/1口）
  let people = [
    { name: '', shares: 2 },
    { name: '', shares: 1 },
    { name: '', shares: 1 },
  ];

  function renderPeople() {
    peopleList.innerHTML = '';
    people.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'person-row';

      const nameInp = document.createElement('input');
      nameInp.className = 'person-name-inp';
      nameInp.type = 'text';
      nameInp.placeholder = `${i + 1}人目`;
      nameInp.value = p.name;
      nameInp.maxLength = 10;
      nameInp.addEventListener('input', () => { people[i].name = nameInp.value; calcWarikan(); });

      const ctrl = document.createElement('div');
      ctrl.className = 'shares-ctrl';

      const dec = document.createElement('button');
      dec.className = 'sh-btn';
      dec.textContent = '−';
      dec.addEventListener('click', () => {
        if (people[i].shares > 1) { people[i].shares--; renderPeople(); calcWarikan(); }
      });

      const val = document.createElement('span');
      val.className = 'sh-val';
      val.textContent = p.shares;

      const inc = document.createElement('button');
      inc.className = 'sh-btn';
      inc.textContent = '+';
      inc.addEventListener('click', () => {
        if (people[i].shares < 9) { people[i].shares++; renderPeople(); calcWarikan(); }
      });

      ctrl.append(dec, val, inc);

      const rm = document.createElement('button');
      rm.className = 'rm-btn';
      rm.textContent = '×';
      rm.addEventListener('click', () => {
        if (people.length > 1) { people.splice(i, 1); renderPeople(); calcWarikan(); }
      });

      row.append(nameInp, ctrl, rm);
      peopleList.appendChild(row);
    });
  }

  function calcWarikan() {
    totalClear.style.display = totalInp.value ? 'inline' : 'none';

    const raw = parseFloat(totalInp.value);
    if (!totalInp.value || isNaN(raw) || raw <= 0) {
      wResult.style.display = 'none';
      return;
    }

    const total = Math.round(raw);
    const totalShares = people.reduce((s, p) => s + p.shares, 0);
    const unitPrice = total / totalShares;

    // Floor each person's amount, give remainder to the highest-share person
    const amounts = people.map(p => Math.floor(p.shares * unitPrice));
    const remainder = total - amounts.reduce((s, a) => s + a, 0);
    const maxIdx = people.reduce((mi, p, i) => p.shares > people[mi].shares ? i : mi, 0);
    amounts[maxIdx] += remainder;

    wResult.innerHTML = '';
    wResult.style.display = 'block';

    const unitDiv = document.createElement('div');
    unitDiv.className = 'w-unit';
    unitDiv.textContent = `1口  ₹${Math.round(unitPrice).toLocaleString('ja-JP')}  ·  ¥${Math.round(unitPrice * rate).toLocaleString('ja-JP')}`;
    wResult.appendChild(unitDiv);

    const mkDiv = cls => Object.assign(document.createElement('div'), { className: cls });

    wResult.appendChild(mkDiv('w-divider'));

    people.forEach((p, i) => {
      const row = mkDiv('w-row');

      const left = document.createElement('span');
      const nameEl = document.createElement('span');
      nameEl.className = 'w-person';
      nameEl.textContent = p.name || `${i + 1}人目`;
      const sharesEl = document.createElement('span');
      sharesEl.className = 'w-shares';
      sharesEl.textContent = `${p.shares}口`;
      left.append(nameEl, sharesEl);

      const right = document.createElement('div');
      const amt = document.createElement('div');
      amt.className = 'w-amt';
      amt.textContent = `₹${amounts[i].toLocaleString('ja-JP')}`;
      const jpyAmt = document.createElement('div');
      jpyAmt.className = 'w-jpy';
      jpyAmt.textContent = `¥${Math.round(amounts[i] * rate).toLocaleString('ja-JP')}`;
      right.append(amt, jpyAmt);

      row.append(left, right);
      wResult.appendChild(row);
    });

    wResult.appendChild(mkDiv('w-divider'));

    const totalRow = mkDiv('w-total-row');
    const tLabel = document.createElement('span');
    tLabel.className = 'w-total-label';
    tLabel.textContent = '合計';
    const tRight = document.createElement('div');
    const tAmt = document.createElement('div');
    tAmt.className = 'w-total-amt';
    tAmt.textContent = `₹${total.toLocaleString('ja-JP')}`;
    const tJpy = document.createElement('div');
    tJpy.className = 'w-total-jpy';
    tJpy.textContent = `¥${Math.round(total * rate).toLocaleString('ja-JP')}`;
    tRight.append(tAmt, tJpy);
    totalRow.append(tLabel, tRight);
    wResult.appendChild(totalRow);
  }

  addBtn.addEventListener('click', () => {
    if (people.length >= 10) return;
    people.push({ name: '', shares: 1 });
    renderPeople();
    calcWarikan();
    peopleList.querySelectorAll('.person-name-inp')[people.length - 1]?.focus();
  });

  totalInp.addEventListener('input', calcWarikan);
  totalInp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { totalInp.value = ''; calcWarikan(); }
  });
  totalClear.addEventListener('click', () => { totalInp.value = ''; calcWarikan(); totalInp.focus(); });

  renderPeople();

  window.addEventListener('load', () => fromInput.focus());
})();
</script>
</body>
</html>
