<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="₹↔¥" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>₹ ↔ ¥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Sora:wght@300;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d0d0d;
      color: #f0ede6;
      font-family: 'DM Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100svh;
      padding-top: max(env(safe-area-inset-top), 16px);
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
      margin-top: 4px;
      animation: fadeUp .4s ease both;
    }
    .header-label {
      font-family: 'Sora', sans-serif;
      font-size: 10px;
      letter-spacing: .25em;
      color: #ff6b2b;
      text-transform: uppercase;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 22px;
      padding: 16px;
      animation: fadeUp .4s .06s ease both;
      opacity: 0;
    }
    .field-label {
      font-size: 10px;
      letter-spacing: .2em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: #111;
      border: 1.5px solid #2e2e2e;
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: #ff6b2b66; }
    .sym {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .sym-from { color: #ff6b2b; }
    .sym-to   { color: #4ade80; }
    #from-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      color: #f0ede6;
      min-width: 0;
    }
    #from-input::placeholder { color: #2a2a2a; }
    .clear-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 20px;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
      display: none;
      -webkit-tap-highlight-color: transparent;
    }
    .middle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .toggle-btn {
      background: #222;
      border: 1.5px solid #333;
      border-radius: 50%;
      width: 38px; height: 38px;
      flex-shrink: 0;
      font-size: 16px;
      cursor: pointer;
      color: #ff6b2b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .toggle-btn:active { background: #2a2a2a; }
    .result-row {
      flex: 1;
      display: flex;
      align-items: center;
      background: #111;
      border: 1.5px solid #2a2a2a;
      border-radius: 14px;
      padding: 10px 14px;
      min-height: 52px;
      transition: border-color .2s, background .2s;
    }
    .result-row.active {
      background: #0c180c;
      border-color: #1d4d1d;
    }
    #to-result {
      font-family: 'DM Mono', monospace;
      font-size: 26px;
      color: #2a2a2a;
      transition: color .2s;
    }
    .result-row.active #to-result { color: #f0ede6; }
    .quick-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .quick-btn {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 9px 2px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #666;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-btn:active { border-color: #ff6b2b66; color: #ff6b2b; }
    .rate-info {
      margin-top: 10px;
      font-size: 11px;
      color: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-live     { background: #4ade80; animation: pulse 2s infinite; }
    .dot-loading  {
      width: 10px; height: 10px;
      border: 1.5px solid #333;
      border-top-color: #ff6b2b;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .dot-fallback { background: #f59e0b; }
    .flags {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0.3;
    }
    .flags span { font-size: 52px; }
    .flags-arrow { font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-label" id="header-label">India → Japan</div>
  </div>
  <div class="card">
    <div class="field-label" id="from-label">インドルピー</div>
    <div class="input-row">
      <span class="sym sym-from" id="from-sym">₹</span>
      <input id="from-input" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
      <button class="clear-btn" id="clear-btn">×</button>
    </div>
    <div class="middle-row">
      <button class="toggle-btn" id="toggle-btn">⇄</button>
      <div class="result-row" id="result-row">
        <span class="sym sym-to" id="to-sym">¥</span>
        <span id="to-result">—</span>
      </div>
    </div>
    <div class="quick-row" id="quick-row">
      <button class="quick-btn" data-v="100">₹100</button>
      <button class="quick-btn" data-v="500">₹500</button>
      <button class="quick-btn" data-v="1000">₹1K</button>
      <button class="quick-btn" data-v="5000">₹5K</button>
      <button class="quick-btn" data-v="10000">₹1万</button>
    </div>
    <div class="rate-info">
      <span id="rate-dot" class="dot dot-loading"></span>
      <span id="rate-text">レート取得中...</span>
    </div>
  </div>
  <div class="flags">
    <span>🇮🇳</span>
    <span class="flags-arrow">↔</span>
    <span>🇯🇵</span>
  </div>
<script>
(function () {
  const FALLBACK_RATE = 1.695;
  const CACHE_KEY = 'inrjpy_rate_v2';
  let rate = FALLBACK_RATE;
  let mode = 'INR_TO_JPY';

  const fromInput   = document.getElementById('from-input');
  const toResult    = document.getElementById('to-result');
  const resultRow   = document.getElementById('result-row');
  const clearBtn    = document.getElementById('clear-btn');
  const toggleBtn   = document.getElementById('toggle-btn');
  const rateDot     = document.getElementById('rate-dot');
  const rateText    = document.getElementById('rate-text');
  const headerLabel = document.getElementById('header-label');
  const fromLabel   = document.getElementById('from-label');
  const fromSym     = document.getElementById('from-sym');
  const toSym       = document.getElementById('to-sym');
  const quickRow    = document.getElementById('quick-row');

  function dateStr() {
    return new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function getRate() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && (Date.now() - cached.ts) < 24 * 60 * 60 * 1000) {
        return { rate: cached.rate, fresh: false };
      }
      const res = await fetch('https://api.exchangerate-api.com/v4/latest/INR');
      if (!res.ok) throw new Error();
      const data = await res.json();
      const r = data.rates?.JPY;
      if (!r) throw new Error();
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rate: r, ts: Date.now() }));
      return { rate: r, fresh: true };
    } catch {
      try {
        const res2 = await fetch('https://open.er-api.com/v6/latest/INR');
        const data2 = await res2.json();
        const r2 = data2.rates?.JPY;
        if (!r2) throw new Error();
        localStorage.setItem(CACHE_KEY, JSON.stringify({ rate: r2, ts: Date.now() }));
        return { rate: r2, fresh: true };
      } catch {
        return { rate: FALLBACK_RATE, fresh: null };
      }
    }
  }

  function updateRateDisplay(fresh) {
    const d = dateStr();
    if (fresh === null) {
      rateDot.className = 'dot dot-fallback';
      rateText.textContent = `1 ₹ = ¥${rate.toFixed(3)}（参考値）`;
    } else {
      rateDot.className = 'dot dot-live';
      rateText.textContent = `1 ₹ = ¥${rate.toFixed(3)}（${d}）`;
    }
  }

  getRate().then(({ rate: r, fresh }) => {
    rate = r;
    updateRateDisplay(fresh);
    recalc();
  });

  const QUICK_INR = [100, 500, 1000, 5000, 10000];
  const QUICK_JPY = [500, 1000, 5000, 10000, 50000];
  const LABELS_INR = ['₹100','₹500','₹1K','₹5K','₹1万'];
  const LABELS_JPY = ['¥500','¥1K','¥5K','¥1万','¥5万'];

  function updateUI() {
    const isINR = mode === 'INR_TO_JPY';
    headerLabel.textContent = isINR ? 'India → Japan' : 'Japan → India';
    fromLabel.textContent   = isINR ? 'インドルピー' : '日本円';
    fromSym.textContent     = isINR ? '₹' : '¥';
    toSym.textContent       = isINR ? '¥' : '₹';
    const vals   = isINR ? QUICK_INR : QUICK_JPY;
    const labels = isINR ? LABELS_INR : LABELS_JPY;
    quickRow.querySelectorAll('.quick-btn').forEach((btn, i) => {
      btn.dataset.v   = vals[i];
      btn.textContent = labels[i];
    });
  }

  function recalc() {
    const v = parseFloat(fromInput.value);
    if (!isNaN(v) && v >= 0 && fromInput.value !== '') {
      const isINR = mode === 'INR_TO_JPY';
      const result = isINR ? Math.round(v * rate) : Math.round(v / rate);
      toResult.textContent = result.toLocaleString('ja-JP');
      resultRow.classList.add('active');
      clearBtn.style.display = 'inline';
    } else {
      toResult.textContent = '—';
      resultRow.classList.remove('active');
      clearBtn.style.display = 'none';
    }
  }

  fromInput.addEventListener('input', recalc);
  fromInput.addEventListener('keydown', e => { if (e.key === 'Escape') clear(); });
  clearBtn.addEventListener('click', clear);

  function clear() {
    fromInput.value = '';
    recalc();
    fromInput.focus();
  }

  toggleBtn.addEventListener('click', () => {
    mode = mode === 'INR_TO_JPY' ? 'JPY_TO_INR' : 'INR_TO_JPY';
    fromInput.value = '';
    updateUI();
    recalc();
  });

  quickRow.addEventListener('click', e => {
    const btn = e.target.closest('.quick-btn');
    if (!btn) return;
    fromInput.value = btn.dataset.v;
    recalc();
  });

  window.addEventListener('load', () => fromInput.focus());
})();
</script>
</body>
</html>
